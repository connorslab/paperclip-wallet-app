[package]
edition = "2021"
name = "bitcoind-async-client"
version = "0.15.0"
authors = [
    "Jose Storopoli <jose@alpenlabs.io>",
    "Bibek Pandey <bibek@alpenlabs.io>",
    "Ashish Thapa <ashish@alpenlabs.io>",
    "Prajwol Gyawali <prajwol@alpenlabs.io>",
    "Rajil Bajracharya <rajil@alpenlabs.io>",
    "Sapin Bajracharya <sapin@alpenlabs.io>",
    "Trey Del Bonis <trey@alpenlabs.io>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "BitcoinD JSON-RPC Async Client"
readme = "README.md"
keywords = [
    "crypto",
    "bitcoin",
]
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alpenlabs/bitcoind-async-client"

[features]
29_0 = ["corepc-node/29_0"]
30_2 = ["corepc-node/30_2"]
default = ["30_2"]
raw_rpc = []
socks5-proxy = ["dep:ureq"]

[lib]
name = "bitcoind_async_client"
path = "src/lib.rs"

[dependencies.base64]
version = "0.22.1"

[dependencies.bitcoin]
version = "0.32.9"
features = [
    "serde",
    "base64",
]

[dependencies.bitreq]
version = "0.3.5"
features = ["async-https"]
default-features = false

[dependencies.corepc-types]
version = "0.13.0"

[dependencies.hex]
version = "0.2.1"
package = "hex-conservative"

[dependencies.secp256k1]
version = "0.29.1"
features = ["global-context"]

[dependencies.serde]
version = "1.0.228"

[dependencies.serde_json]
version = "1.0.149"
features = ["raw_value"]

[dependencies.thiserror]
version = "2.0.18"

[dependencies.tokio]
version = "1.52.3"
features = [
    "macros",
    "rt-multi-thread",
]

[dependencies.tracing]
version = "0.1.41"
default-features = false

[dev-dependencies.anyhow]
version = "1.0.102"

[dev-dependencies.corepc-node]
version = "0.12.0"
features = ["download"]

[dev-dependencies.proptest]
version = "1.11.0"
features = ["std"]
default-features = false

[dev-dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies.ureq]
version = "3"
features = ["socks-proxy"]
optional = true
