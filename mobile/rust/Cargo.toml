[package]
name = "paperclip-mobile"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
test-harness = []

[[bin]]
name = "paperclip-mobile-lab"
path = "src/lab.rs"
required-features = ["test-harness"]

[dependencies]
bark-wallet = { path = "../../bark", default-features = false, features = ["rand", "sqlite-bundled", "native", "tls-webpki-roots", "onchain-bdk", "bitcoind-rpc", "socks5-proxy", "electrum"] }
bitcoin.workspace = true
anyhow.workspace = true
serde_json.workspace = true
base64.workspace = true
bip39 = { workspace = true, features = ["rand"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }

bark-bitcoin-ext = { path = "../../bitcoin-ext", features = ["xbt-mainnet"] }

ark-lib = { path = "../../lib" }

[dev-dependencies]
bitcoind-async-client.workspace = true
