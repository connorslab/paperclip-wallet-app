name: Paperclip
options:
  preGenCommand: bash Scripts/prepare-tor-framework.sh
  deploymentTarget:
    iOS: '17.0'
packages:
  TorRuntime:
    path: ../TorRuntime
  PaperclipMobile:
    path: ..
targets:
  Paperclip:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: PaperclipMobile
      - package: TorRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.paperclippool.wallet.preview
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Simulator.entitlements
        SWIFT_VERSION: '5.0'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge.h
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': ['$(inherited)', '$(SRCROOT)/../../target/aarch64-apple-ios-sim/debug']
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': ['$(inherited)', '$(SRCROOT)/../../target/aarch64-apple-ios/$(PAPERCLIP_RUST_PROFILE)']
        OTHER_LDFLAGS: ['$(inherited)', '-lpaperclip_mobile', '-lc++', '-lsqlite3', '-framework', 'Security', '-framework', 'SystemConfiguration']
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '70'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIBackgroundModes: [fetch, processing]
      configs:
        Debug:
          PAPERCLIP_RUST_PROFILE: debug
        Release:
          PAPERCLIP_RUST_PROFILE: release
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Paperclip
        NSCameraUsageDescription: Scan wallet QR codes, or optionally contribute local camera samples when creating a seed.
        NSMicrophoneUsageDescription: Optionally contribute local audio samples when creating a seed. Audio is not recorded or uploaded.
        NSMotionUsageDescription: Optionally contribute local gyroscope samples when creating a seed.
        NSFaceIDUsageDescription: Unlock your Paperclip wallet.
        NSLocalNetworkUsageDescription: Connect to your XBT, Lightning, or Tor node on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            onion:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - xyz.paperclippool.wallet.preview.refresh
          - xyz.paperclippool.wallet.preview.processing
  PaperclipNativeTestHost:
    type: application
    platform: iOS
    sources: [NativeTests/Host.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: xyz.paperclippool.wallet.native-test-host
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': NativeTests/Simulator.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PaperclipNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NativeTests
        excludes: [Host.swift, Simulator.entitlements]
      - path: Sources/NativeWallet.swift
      - path: Sources/EmbeddedTor.swift
    dependencies:
      - target: PaperclipNativeTestHost
      - package: PaperclipMobile
      - package: TorRuntime
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: xyz.paperclippool.wallet.native-tests
        SWIFT_VERSION: '5.0'
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge.h
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PaperclipNativeTestHost.app/PaperclipNativeTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': ['$(inherited)', '$(SRCROOT)/../../target/aarch64-apple-ios-sim/debug']
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': ['$(inherited)', '$(SRCROOT)/../../target/aarch64-apple-ios/debug']
        OTHER_LDFLAGS: ['$(inherited)', '-lpaperclip_mobile', '-lc++', '-lsqlite3', '-framework', 'Security', '-framework', 'SystemConfiguration']
  PaperclipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Paperclip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: xyz.paperclippool.wallet.preview.tests
schemes:
  Paperclip:
    build:
      targets:
        Paperclip: all
    test:
      targets: [PaperclipNativeTests, PaperclipUITests]
