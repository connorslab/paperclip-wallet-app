name: Paperclip
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  PaperclipMobile:
    path: ..
targets:
  Paperclip:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: PaperclipMobile
      - framework: ../../target/aarch64-apple-ios-sim/debug/libpaperclip_mobile.a
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.paperclippool.wallet.preview
        SWIFT_VERSION: '5.9'
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge.h
        OTHER_LDFLAGS: ['$(inherited)', '-lc++', '-lsqlite3', '-framework', 'Security', '-framework', 'SystemConfiguration']
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIBackgroundModes: [fetch, processing]
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Paperclip Preview
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - xyz.paperclippool.wallet.preview.refresh
          - xyz.paperclippool.wallet.preview.processing
schemes:
  Paperclip:
    build:
      targets:
        Paperclip: all
