name: Paperclip
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  PaperclipMobile:
    path: ..
targets:
  Paperclip:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: PaperclipMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.paperclippool.wallet.preview
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Simulator.entitlements
        SWIFT_VERSION: '5.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge.h
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': ['$(inherited)', '$(SRCROOT)/../../target/aarch64-apple-ios-sim/debug']
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': ['$(inherited)', '$(SRCROOT)/../../target/aarch64-apple-ios/debug']
        OTHER_LDFLAGS: ['$(inherited)', '-lpaperclip_mobile', '-lc++', '-lsqlite3', '-framework', 'Security', '-framework', 'SystemConfiguration']
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIBackgroundModes: [fetch, processing]
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Paperclip
        NSFaceIDUsageDescription: Unlock your Paperclip wallet.
        NSLocalNetworkUsageDescription: Connect to your XBT, Lightning, or Tor node on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            onion:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - xyz.paperclippool.wallet.preview.refresh
          - xyz.paperclippool.wallet.preview.processing
  PaperclipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Paperclip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: xyz.paperclippool.wallet.preview.tests
schemes:
  Paperclip:
    build:
      targets:
        Paperclip: all
    test:
      targets: [PaperclipUITests]
