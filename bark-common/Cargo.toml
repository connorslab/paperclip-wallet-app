[package]
name = "bark-common"
version = "0.8.1"
license = "MIT"
authors = [ "Team Second <hello@second.tech>" ]
repository = "https://gitlab.com/ark-bitcoin/bark"
description = "Utilities shared between the bark wallet and server crates"
edition = "2024"

[dependencies]
anyhow.workspace = true
serde.workspace = true
# The "log" feature re-emits events as `log` records when no tracing
# subscriber is set, so both log-based (bark) and tracing-based (server)
# binaries capture them.
tracing = { workspace = true, features = [ "log" ] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"
