name: Native Windows bundled Jars
on:
  workflow_dispatch:
  push:
    branches: ['codex/cross-platform-parity']
    paths: ['deployment/jam/**', 'deployment/desktop/windows/**', 'deployment/desktop/managed_jam.py', 'deployment/desktop/test_managed_jam.py', 'deployment/desktop/test_managed_tor.py', 'deployment/desktop/managed_tor.py', 'deployment/desktop/tor_runtime.py', 'deployment/desktop/prepare_tor.py', 'deployment/desktop/tor-artifacts.json', 'deployment/desktop/managed_daemon.py', 'deployment/desktop/pipe_io.py', '.github/workflows/windows-jars.yml']
  pull_request:
    paths: ['deployment/jam/**', 'deployment/desktop/windows/**', 'deployment/desktop/managed_jam.py', 'deployment/desktop/test_managed_jam.py', 'deployment/desktop/test_managed_tor.py', 'deployment/desktop/managed_tor.py', 'deployment/desktop/tor_runtime.py', 'deployment/desktop/prepare_tor.py', 'deployment/desktop/tor-artifacts.json', 'deployment/desktop/managed_daemon.py', 'deployment/desktop/pipe_io.py', '.github/workflows/windows-jars.yml']
permissions:
  contents: read
concurrency:
  group: windows-jars-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-runtime:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the pinned official archive on its native target
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'deployment/desktop')
          from tor_runtime import target
          record = json.loads(Path('deployment/desktop/tor-artifacts.json').read_text())['targets'][target()]
          archive = Path(os.environ['RUNNER_TEMP']) / 'reviewed-tor.tar.gz'
          # The preparer checks the signature-verified hash before extraction.
          with urllib.request.urlopen(record['source'], timeout=60) as response, archive.open('xb') as output:
              total = 0
              while block := response.read(1024 * 1024):
                  total += len(block)
                  if total > 128 * 1024 * 1024: raise ValueError('Oversized Tor download')
                  output.write(block)
          command = [sys.executable, 'deployment/desktop/prepare_tor.py', '--archive', str(archive), '--output', str(archive.parent / 'Tor Runtime')]
          if sys.platform == 'darwin': command += ['--ad-hoc-sign']
          subprocess.run(command, check=True)
          PY
      - uses: actions/checkout@v4
        with:
          repository: Kilombino/joinblaket
          ref: 40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3
          path: .native-jars-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bitcoin-core/secp256k1
          ref: 0cdc758a56360bf58a851fe91085a327ec97685a
          path: .native-secp-source
          persist-credentials: false
      - name: Build the pinned native crypto library
        run: |
          cmake -S .native-secp-source -B "$env:RUNNER_TEMP/secp-build" -A x64 -DBUILD_SHARED_LIBS=ON -DSECP256K1_ENABLE_MODULE_RECOVERY=ON -DSECP256K1_BUILD_TESTS=ON -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF -DSECP256K1_BUILD_BENCHMARK=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/secp-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/secp-build" -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $libraries = @(Get-ChildItem "$env:RUNNER_TEMP/secp-build" -Recurse -Filter '*secp256k1*.dll')
          if ($libraries.Count -ne 1) { throw 'Expected exactly one reviewed crypto library.' }
          "PAPERCLIP_SECP=$($libraries[0].FullName)" >> $env:GITHUB_ENV
      - name: Install hash-locked dependencies and the pinned runtime
        run: |
          python -m venv "$env:RUNNER_TEMP/jars-venv"
          $py = "$env:RUNNER_TEMP/jars-venv/Scripts/python.exe"
          "JARS_PYTHON=$py" >> $env:GITHUB_ENV
          & $py -m pip install pip==26.3 setuptools==84.2.1 wheel==0.48.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The upstream Linux lock includes uvloop, an optional uvicorn speedup.
          # Retain every version/hash and mark only this POSIX dependency inapplicable.
          python -c "from pathlib import Path; import re; files=list(Path('.native-jars-source').glob('*/requirements.txt')); [(p.write_text(re.sub(r'(?m)^(uvloop==[^\s]+)', r'\1 ; sys_platform != '+chr(34)+'win32'+chr(34), p.read_text()),newline='')) for p in files]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install --require-hashes -r deployment/desktop/windows/jars-requirements.txt -r .native-jars-source/jmcore/requirements.txt -r .native-jars-source/jmwallet/requirements.txt -r .native-jars-source/maker/requirements.txt -r .native-jars-source/taker/requirements.txt -r .native-jars-source/orderbook_watcher/requirements.txt -r .native-jars-source/jmwalletd/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install --no-deps --no-build-isolation ./.native-jars-source/jmcore ./.native-jars-source/jmwallet ./.native-jars-source/maker ./.native-jars-source/taker ./.native-jars-source/orderbook_watcher ./.native-jars-source/tumbler ./.native-jars-source/jmwalletd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install pywin32==311 pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py deployment/desktop/windows/prepare_jars.py --deployment "$env:GITHUB_WORKSPACE/deployment"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip check
      - name: Verify Tor using the packaged Jars build interpreter
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/desktop"
          & $env:JARS_PYTHON deployment/desktop/test_managed_tor.py --tor "$env:RUNNER_TEMP/Tor Runtime/tor/tor.exe" --network -v
      - name: Verify native crypto and patched API imports
        run: |
          & $env:JARS_PYTHON -c "import os, bitcointx; bitcointx.set_custom_secp256k1_path(os.environ['PAPERCLIP_SECP']); from bitcointx.core.key import CKey; key=CKey.from_secret_bytes(bytes([1])*32); digest=bytes([2])*32; assert key.pub.verify(digest,key.sign(digest)); from jmwalletd.app import create_app; from jmwalletd.wallet_ops import _reserve_wallet_path; print('Native crypto signature and patched Jars API imports passed.')"
      - name: Verify newly generated TLS ownership
        run: |
          & $env:JARS_PYTHON deployment/desktop/windows/test_jars_tls.py -v
      - name: Freeze the complete Jars runtime
        run: |
          & $env:JARS_PYTHON deployment/desktop/windows/build_jars.py --source "$env:GITHUB_WORKSPACE/deployment" --secp256k1 "$env:PAPERCLIP_SECP" --secp256k1-license "$env:GITHUB_WORKSPACE/.native-secp-source/COPYING" --output "$env:RUNNER_TEMP/jars-bundle" --work "$env:RUNNER_TEMP/jars-freeze"
      - name: Test relocated bundle with verified TLS and isolated unfunded storage
        timeout-minutes: 4
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/desktop"
          & $env:JARS_PYTHON deployment/desktop/windows/test_jars_bundle.py --bundle "$env:RUNNER_TEMP/jars-bundle/PaperclipJars" -v

      - name: Verify node preflight and private initial setup in the frozen Jars helper
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/jam;$env:GITHUB_WORKSPACE/deployment/desktop"
          $env:PAPERCLIP_NODE_CHECK_EXECUTABLE = "$env:RUNNER_TEMP/jars-bundle/PaperclipJars/PaperclipJars.exe"
          & $env:JARS_PYTHON deployment/jam/test_node_setup.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:JARS_PYTHON deployment/jam/test_node_store.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select the reviewed Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Prepare native build dependencies
        shell: pwsh
        run: |
          choco install protoc --version=36.2.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP 'boost_1_85_0.7z'
          Invoke-WebRequest 'https://archives.boost.io/release/1.85.0/source/boost_1_85_0.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '16d16b9658753117c1434e5450c5eac194957f4b6d0b390b9d07900d37c115a4') { throw 'Boost archive checksum mismatch.' }
          & 7z x -y "-o$env:RUNNER_TEMP" $archive 'boost_1_85_0/boost/*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $boost = Join-Path $env:RUNNER_TEMP 'boost_1_85_0'
          if (!(Test-Path (Join-Path $boost 'boost/multi_index_container.hpp'))) { throw 'Required Boost headers are missing.' }
          "BOOST_ROOT=$boost" >> $env:GITHUB_ENV
          "CXXFLAGS=/I`"$boost`"" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "BARK_WEB_DIST=$env:GITHUB_WORKSPACE\web" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-native-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-native-${{ hashFiles('Cargo.lock') }}-
            windows-native-
      - name: Verify native private files and atomic replacement
        run: cargo +1.91.0 test --locked -p bark-common --lib fs_perms
      - name: Build the shared daemon with embedded UI and SQLite
        run: cargo +1.91.0 build --locked -p bark-cli --bin paperclip-walletd --features barkd-web-ui,sqlite-bundled
      - name: Verify the wallet and frozen Jars share ownership and TLS
        timeout-minutes: 5
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/desktop"
          & $env:JARS_PYTHON deployment/desktop/test_managed_jam.py --python "$env:RUNNER_TEMP/jars-bundle/PaperclipJars/PaperclipJars.exe" --binary target/debug/paperclip-walletd.exe --tor "$env:RUNNER_TEMP/Tor Runtime/tor/tor.exe" -v
      - name: Package and test the standalone Windows app with Jars
        timeout-minutes: 10
        run: |
          & $env:JARS_PYTHON deployment/desktop/windows/build_preview.py --binary target/debug/paperclip-walletd.exe --jars "$env:RUNNER_TEMP/jars-bundle/PaperclipJars" --tor-runtime "$env:RUNNER_TEMP/Tor Runtime" --output "$env:RUNNER_TEMP/app with jars" --work "$env:RUNNER_TEMP/app-freeze"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/app with jars/PaperclipLauncherQA/PaperclipLauncherQA.exe" --binary "$env:RUNNER_TEMP/app with jars/PaperclipLauncher/paperclip-walletd.exe" --executable "$env:RUNNER_TEMP/app with jars/PaperclipLauncher/PaperclipLauncher.exe" -v
