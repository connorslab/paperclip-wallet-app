name: Resolve RPC hotfix dependencies
on:
  push:
    branches: [fix/rpc-connection-recovery]
    paths: [.github/workflows/resolve-rpc-lock.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve required TLS patch
        run: |
          cargo update -p bitreq -p rustls@0.23.45 -p webpki-roots@1.0.7 -p rustls-webpki -p rustls-native-certs -p tokio-rustls
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          git diff -- Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-rpc-lock
          path: Cargo.lock
