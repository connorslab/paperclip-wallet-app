name: Resolve RPC hotfix dependencies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve required TLS patch
        run: |
          cargo update -p rustls@0.23.45 --precise 0.23.46
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          git diff -- Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-rpc-lock
          path: Cargo.lock
