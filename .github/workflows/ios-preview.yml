name: iOS proof of concept
on:
  workflow_dispatch:
  push:
    branches: [feature/ios-wallet]
    paths: ['mobile/**', '.github/workflows/ios-preview.yml', 'bark/**', 'bitcoin-ext/**', 'vendor/electrum-client/**', 'Cargo.toml', 'Cargo.lock']
permissions:
  contents: read
concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test wallet policies, connections, and backups
        working-directory: mobile
        run: swift test
  ios:
    needs: [rust-port, swift-tests]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test refresh, notifications, and encrypted backups
        working-directory: mobile
        run: swift test
      - name: Generate app project
        run: brew install xcodegen && cd mobile/iOS && xcodegen generate
      - uses: actions/download-artifact@v4
        with:
          name: paperclip-rust-ios-simulator
          path: target/aarch64-apple-ios-sim/debug
      - name: Build simulator app
        run: xcodebuild -project mobile/iOS/Paperclip.xcodeproj -scheme Paperclip -sdk iphonesimulator -configuration Debug -derivedDataPath mobile/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Test native bridge in an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcodebuild -project mobile/iOS/Paperclip.xcodeproj -scheme Paperclip -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath mobile/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperclip-iOS-test-results
          path: mobile/DerivedData/Logs/Test
      - name: Capture simulator preview
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" mobile/DerivedData/Build/Products/Debug-iphonesimulator/Paperclip.app
          xcrun simctl launch "$DEVICE" xyz.paperclippool.wallet.preview
          sleep 3
          mkdir -p mobile/screenshots
          xcrun simctl io "$DEVICE" screenshot mobile/screenshots/home.png
      - uses: actions/upload-artifact@v4
        with:
          name: Paperclip-iOS-screenshots
          path: mobile/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperclip-iOS-simulator-preview
          path: mobile/DerivedData/Build/Products/Debug-iphonesimulator/Paperclip.app
  rust-port:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-rust-1.90-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ios-rust-1.90-${{ hashFiles('Cargo.lock') }}-
            ios-rust-1.90-
      - name: Install Rust and native build dependencies
        run: |
          brew install protobuf cmake just
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-apple-ios aarch64-apple-ios-sim
      - name: Check the existing wallet engine for device and simulator
        env:
          CARGO_BUILD_JOBS: '3'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          cargo +1.90.0 build --locked -p paperclip-mobile --target aarch64-apple-ios
          cargo +1.90.0 build --locked -p paperclip-mobile --target aarch64-apple-ios-sim
      - name: Test native wallet persistence and recovery
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
          CARGO_BUILD_JOBS: '3'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          just unit-mobile
          just unit unified_
          just unit-electrum
      - uses: actions/upload-artifact@v4
        with:
          name: paperclip-rust-ios-simulator
          path: target/aarch64-apple-ios-sim/debug/libpaperclip_mobile.a
