name: iOS proof of concept
on:
  workflow_dispatch:
  push:
    branches: [feature/ios-wallet]
    paths: ['mobile/**', '.github/workflows/ios-preview.yml', 'bark/**', 'bitcoin-ext/**']
permissions:
  contents: read
jobs:
  ios:
    needs: rust-port
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test refresh and notification policy
        working-directory: mobile
        run: swift test
      - name: Generate app project
        run: brew install xcodegen && cd mobile/iOS && xcodegen generate
      - uses: actions/download-artifact@v4
        with:
          name: paperclip-rust-ios-simulator
          path: target/aarch64-apple-ios-sim/debug
      - name: Build simulator app
        run: xcodebuild -project mobile/iOS/Paperclip.xcodeproj -scheme Paperclip -sdk iphonesimulator -configuration Debug -derivedDataPath mobile/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Paperclip-iOS-simulator-preview
          path: mobile/DerivedData/Build/Products/Debug-iphonesimulator/Paperclip.app
  rust-port:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and native build dependencies
        run: |
          brew install protobuf cmake
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-apple-ios aarch64-apple-ios-sim
      - name: Check the existing wallet engine for device and simulator
        env:
          CARGO_BUILD_JOBS: '3'
        run: |
          cargo +1.90.0 build --locked -p paperclip-mobile --target aarch64-apple-ios
          cargo +1.90.0 build --locked -p paperclip-mobile --target aarch64-apple-ios-sim
      - uses: actions/upload-artifact@v4
        with:
          name: paperclip-rust-ios-simulator
          path: target/aarch64-apple-ios-sim/debug/libpaperclip_mobile.a
