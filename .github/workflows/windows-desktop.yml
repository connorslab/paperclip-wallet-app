name: Native Windows desktop prerequisite
on:
  workflow_dispatch:
  push:
    branches: ['codex/cross-platform-parity']
    paths: ['.github/workflows/windows-desktop.yml', 'deployment/desktop/windows/**', 'deployment/desktop/linux/launcher.py', 'deployment/desktop/managed_daemon.py', 'deployment/desktop/pipe_io.py', 'deployment/desktop/test_pipe_io.py', 'deployment/desktop/test_native_daemon.py', 'deployment/jam/paperclip_jam/journal.py', 'deployment/jam/test_journal.py', 'deployment/jam/paperclip_jam/hosting.py', 'deployment/jam/test_runtime_lock.py', 'deployment/jam/test_certificate_handoff.py', 'deployment/jam/install_windows_storage.py', 'deployment/jam/install_windows_wallet_ops.py', 'deployment/jam/install_windows_metadata.py', 'deployment/jam/install_windows_utxo_metadata.py', 'deployment/jam/install_windows_history.py', 'deployment/jam/install_windows_bond_registry.py', 'deployment/jam/paperclip_jam/windows_history.py', 'deployment/jam/paperclip_jam/windows_metadata.py', 'deployment/jam/paperclip_jam/windows_wallet_ops.py', 'deployment/jam/paperclip_jam/windows_storage.py', 'bark/src/lock_manager/**', 'bark/Cargo.toml', 'bark-common/**', 'bark-cli/**', 'bark-rest/src/profiles.rs', 'bark-rest/src/lib.rs', 'scripts/test-hot-profiles-daemon.py', 'Cargo.lock']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify private Windows storage and kernel ownership
        run: |
          python -m pip install pywin32==311 cryptography==50.0.2
          python deployment/desktop/windows/test_private_storage.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/desktop/windows/test_launcher.py -v
      - name: Verify owned subprocess pipe deadlines and EOF
        timeout-minutes: 2
        run: python deployment/desktop/test_pipe_io.py -v
      - name: Verify native Jars journal durability and non-replay
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/jam;$env:GITHUB_WORKSPACE/deployment/desktop"
          python deployment/jam/test_journal.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/jam/test_runtime_lock.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/jam/test_certificate_handoff.py -v
      - name: Fetch the reviewed Jars file API
        uses: actions/checkout@v4
        with:
          repository: Kilombino/joinblaket
          ref: 40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3
          path: .native-jam-source
          persist-credentials: false
      - name: Verify the patched upstream Windows file API
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/jam;$env:GITHUB_WORKSPACE/deployment/desktop"
          # Read immutable Git bytes; Windows checkout can rewrite LF as CRLF.
          python -c "import os, subprocess; from pathlib import Path; blob = subprocess.check_output(['git', '-C', '.native-jam-source', 'show', '40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3:jmcore/src/jmcore/secure_files.py']); checked = Path('.native-jam-source/jmcore/src/jmcore/secure_files.py').read_bytes(); print('Checkout newline conversion:', checked != blob and checked.replace(bytes([13,10]), bytes([10])) == blob); Path(os.environ['RUNNER_TEMP'], 'reviewed-secure-files.py').write_bytes(blob)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/desktop/windows/test_jam_storage.py --upstream "$env:RUNNER_TEMP/reviewed-secure-files.py" -v
      - name: Verify pinned Jars wallet lifecycle ownership
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/jam;$env:GITHUB_WORKSPACE/deployment/desktop"
          python -c "import os, subprocess; from pathlib import Path; blob = subprocess.check_output(['git', '-C', '.native-jam-source', 'show', '40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3:jmwalletd/src/jmwalletd/wallet_ops.py']); Path(os.environ['RUNNER_TEMP'], 'reviewed-wallet-ops.py').write_bytes(blob)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/desktop/windows/test_jam_wallet_ops.py --upstream "$env:RUNNER_TEMP/reviewed-wallet-ops.py" -v
      - name: Verify pinned Jars identity metadata and selection
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/jam;$env:GITHUB_WORKSPACE/deployment/desktop"
          python -m pip install pydantic==2.14.2 loguru==0.7.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os, subprocess; from pathlib import Path; blob = subprocess.check_output(['git', '-C', '.native-jam-source', 'show', '40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3:jmcore/src/jmcore/wallet_metadata.py']); Path(os.environ['RUNNER_TEMP'], 'reviewed-wallet-metadata.py').write_bytes(blob)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/desktop/windows/test_jam_metadata.py --upstream "$env:RUNNER_TEMP/reviewed-wallet-metadata.py" -v
      - name: Verify pinned Jars CoinJoin input reservations
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/jam;$env:GITHUB_WORKSPACE/deployment/desktop"
          python -c "import os, subprocess; from pathlib import Path; blob = subprocess.check_output(['git', '-C', '.native-jam-source', 'show', '40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3:jmwallet/src/jmwallet/wallet/utxo_metadata.py']); Path(os.environ['RUNNER_TEMP'], 'reviewed-utxo-metadata.py').write_bytes(blob)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/desktop/windows/test_jam_utxo_metadata.py --upstream "$env:RUNNER_TEMP/reviewed-utxo-metadata.py" -v
      - name: Verify pinned Jars history durability
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/jam;$env:GITHUB_WORKSPACE/deployment/desktop"
          python -c "import os, subprocess; from pathlib import Path; blob = subprocess.check_output(['git', '-C', '.native-jam-source', 'show', '40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3:jmwallet/src/jmwallet/history.py']); Path(os.environ['RUNNER_TEMP'], 'reviewed-history.py').write_bytes(blob)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/desktop/windows/test_jam_history.py --upstream "$env:RUNNER_TEMP/reviewed-history.py" -v
      - name: Verify pinned Jars fidelity-bond metadata
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/deployment/jam;$env:GITHUB_WORKSPACE/deployment/desktop"
          python -c "import os, subprocess; from pathlib import Path; blob = subprocess.check_output(['git', '-C', '.native-jam-source', 'show', '40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3:jmwallet/src/jmwallet/wallet/bond_registry.py']); Path(os.environ['RUNNER_TEMP'], 'reviewed-bond-registry.py').write_bytes(blob)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/desktop/windows/test_jam_bond_registry.py --upstream "$env:RUNNER_TEMP/reviewed-bond-registry.py" -v
      - name: Select the reviewed Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Prepare native build dependencies
        shell: pwsh
        run: |
          choco install protoc --version=36.2.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP 'boost_1_85_0.7z'
          Invoke-WebRequest 'https://archives.boost.io/release/1.85.0/source/boost_1_85_0.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '16d16b9658753117c1434e5450c5eac194957f4b6d0b390b9d07900d37c115a4') { throw 'Boost archive checksum mismatch.' }
          & 7z x -y "-o$env:RUNNER_TEMP" $archive 'boost_1_85_0/boost/*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $boost = Join-Path $env:RUNNER_TEMP 'boost_1_85_0'
          if (!(Test-Path (Join-Path $boost 'boost/multi_index_container.hpp'))) { throw 'Required Boost headers are missing.' }
          "BOOST_ROOT=$boost" >> $env:GITHUB_ENV
          "CXXFLAGS=/I`"$boost`"" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "BARK_WEB_DIST=$env:GITHUB_WORKSPACE\web" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-native-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-native-${{ hashFiles('Cargo.lock') }}-
            windows-native-
      - name: Verify native private files and atomic replacement
        run: cargo +1.91.0 test --locked -p bark-common --lib fs_perms
      - name: Build the shared daemon with embedded UI and SQLite
        run: cargo +1.91.0 build --locked -p bark-cli --bin paperclip-walletd --features barkd-web-ui,sqlite-bundled
      - name: Retain compiled dependencies for subsequent native test fixes
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify the native executable starts without wallet storage
        run: ./target/debug/paperclip-walletd.exe --version
      - name: Verify unfunded authenticated startup and crash recovery
        run: python deployment/desktop/test_native_daemon.py --binary target/debug/paperclip-walletd.exe
      - name: Verify isolated native hot-wallet profiles
        run: python scripts/test-hot-profiles-daemon.py target/debug/paperclip-walletd.exe
      - name: Verify owned Windows launcher lifecycle and crash records
        timeout-minutes: 5
        run: python deployment/desktop/windows/test_managed_daemon.py --binary target/debug/paperclip-walletd.exe -v
      - name: Freeze the Windows window and separate QA runner
        timeout-minutes: 10
        run: |
          python -m pip install pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deployment/desktop/windows/build_preview.py --binary target/debug/paperclip-walletd.exe --output "$env:RUNNER_TEMP/preview-built" --work "$env:RUNNER_TEMP/preview-build-work"
      - name: Verify relocated frozen window and crash recovery without source imports
        timeout-minutes: 5
        shell: pwsh
        run: |
          $relocated = Join-Path $env:RUNNER_TEMP 'relocated preview with spaces'
          Move-Item "$env:RUNNER_TEMP/preview-built" $relocated
          Move-Item deployment/desktop "$env:RUNNER_TEMP/desktop-source-not-used"
          try {
            & "$relocated/PaperclipLauncherQA/PaperclipLauncherQA.exe" --binary "$relocated/PaperclipLauncher/paperclip-walletd.exe" --executable "$relocated/PaperclipLauncher/PaperclipLauncher.exe" -v
            $result = $LASTEXITCODE
          } finally {
            Move-Item "$env:RUNNER_TEMP/desktop-source-not-used" deployment/desktop
          }
          exit $result
      - name: Verify Windows PID ownership and readable discovery
        run: |
          cargo +1.91.0 test --locked -p bark-wallet --features onchain-bdk,sqlite-bundled --lib lock_manager::pid_flock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.91.0 test --locked -p bark-cli --features sqlite-bundled --lib connection::test
