name: Android development preview
on:
  workflow_dispatch:
  push:
    branches: [feature/android-wallet]
    paths: ['mobile/android/**', 'mobile/rust/**', '.github/workflows/android-preview.yml', 'bark/**', 'bitcoin-ext/**', 'lib/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock']
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev protobuf-compiler pkg-config
          sdkmanager 'ndk;28.0.13004108'
          rustup toolchain install 1.91.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android
          key: android-native-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'mobile/android/scripts/build-native.sh') }}-${{ github.sha }}
          restore-keys: android-native-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'mobile/android/scripts/build-native.sh') }}-
      - name: Build shared native wallet
        env:
          PAPERCLIP_RUST_PROFILE: dev
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          bash mobile/android/scripts/build-native.sh '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-${{ matrix.abi }}
          path: mobile/android/native/${{ matrix.abi }}/libpaperclip_mobile.a
  app:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: android-native-arm64-v8a
          path: mobile/android/native/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: android-native-x86_64
          path: mobile/android/native/x86_64
      - name: Test Android app and both distribution formats
        working-directory: mobile/android
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
          # Release-format checks are unsigned and use development native libraries.
          # They are not public release candidates; only the debug preview is uploaded.
          bash gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Run tests on an owned emulator after home readiness
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/paperclip-avd-${{ matrix.api }}
          PAPERCLIP_TEST_API: ${{ matrix.api }}
        run: |
          # The former action injected MENU immediately after sys.boot_completed,
          # before Quickstep had a focused window. Do not inject boot-time input.
          sdkmanager emulator "system-images;android-$PAPERCLIP_TEST_API;default;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --name "Paperclip_CI_$PAPERCLIP_TEST_API" --package "system-images;android-$PAPERCLIP_TEST_API;default;x86_64" --device pixel_6
          printf '\nhw.cpu.ncore=2\n' >> "$ANDROID_AVD_HOME/Paperclip_CI_$PAPERCLIP_TEST_API.avd/config.ini"
          python3 mobile/android/scripts/run-emulator.py "Paperclip_CI_$PAPERCLIP_TEST_API" --sdk "$ANDROID_HOME" --reports mobile/android/app/build/reports/emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperclip-Android-preview-api${{ matrix.api }}
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports
            mobile/android/screenshots
