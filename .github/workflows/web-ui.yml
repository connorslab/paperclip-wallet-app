name: Wallet browser regression checks
on:
  workflow_dispatch:
  push:
    branches: ['codex/cross-platform-parity']
    paths: ['web/**', 'scripts/test-*.mjs', 'scripts/test-*.cjs', '.github/workflows/web-ui.yml']
  pull_request:
    paths: ['web/**', 'scripts/test-*.mjs', 'scripts/test-*.cjs', 'bark-rest/src/api/v1/joinblaket.rs', '.github/workflows/web-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Test transport and browser flows with synthetic fixtures
        run: |
          node scripts/test-web.mjs
          node scripts/test-web-transport.mjs
          node scripts/test-receive-qr.mjs
          node scripts/test-setup-browser.cjs
          node scripts/test-seed-setup-browser.cjs
          node scripts/test-joinblaket-browser.cjs
          node scripts/test-jars-setup-browser.cjs
          node scripts/test-navigation-browser.cjs
          node scripts/test-hardware-browser.cjs
          node scripts/test-wallet-races-browser.cjs
          node scripts/test-activity-browser.cjs
          node scripts/test-board-review-browser.cjs
          node scripts/test-send-max-browser.cjs
          node scripts/test-ark-max-browser.cjs
          node scripts/test-fee-replacement-browser.cjs
          node scripts/test-wallet-transfers-browser.cjs
          node scripts/test-wallet-health-browser.cjs
          node scripts/test-remote-node-browser.cjs
          node scripts/test-bridge-browser.cjs
          node scripts/test-bridge-send-browser.cjs
          node scripts/test-submissions-browser.cjs
