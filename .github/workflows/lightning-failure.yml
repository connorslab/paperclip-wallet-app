name: Lightning failure regression checks
on:
  workflow_dispatch:
  push:
    branches: ['fix/lightning-failed-payment-costs', 'codex/cross-platform-parity']
    paths: ['SHARED-SOURCE.sha256', 'bark-common/**', 'bark/**', 'bark-cli/**', 'bark-json/**', 'bark-rest/**', 'mobile/rust/**', 'Cargo.lock', 'web/**', 'scripts/test-desktop-handoff-browser.cjs', 'deployment/desktop/**', 'deployment/managed-chain.py', 'deployment/node_tor.py', 'deployment/test_managed_chain.py', 'deployment/test_node_tor.py', 'justfile', '.github/workflows/lightning-failure.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete Tor runtime packages
        run: python3 deployment/desktop/test_tor_runtime.py -v
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache/restore@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
      - run: sha256sum -c SHARED-SOURCE.sha256
      - run: nix develop .#build --command cargo check --locked -p bark-wallet -p bark-json -p bark-rest --tests --features onchain-bdk
      - run: nix develop .#build --command just unit-wallet lightning
      - run: nix develop .#build --command just unit-wallet onchain::qr
      - run: nix develop .#build --command just unit-wallet onchain::replacement
      - run: nix develop .#build --command just unit-wallet receipt_failure_prevents_arkoor
      - run: nix develop .#build --command just unit-mobile
      - run: nix develop .#build --command just unit-rest
      - run: nix develop .#build --command just unit-daemon
      - run: nix develop .#build --command just unit-profiles
      - run: nix develop .#build --command just unit-creation
      - run: nix develop .#build --command just unit-support
      - run: nix develop .#build --command just unit funded_lightning
      - run: nix develop .#build --command just unit lightning_send_lifetime
      - name: Packaged service supervisor lifecycle
        run: |
          python3 -m unittest discover -s deployment -p test_managed_chain.py
          python3 -m unittest discover -s deployment -p test_node_tor.py
          python3 -m unittest discover -s deployment -p test_container.py
          python3 -m unittest discover -s deployment -p test_package.py
      - name: Unfunded native daemon lifecycle prerequisite
        run: |
          export BARK_WEB_DIST="$PWD/web"
          nix develop .#build --command cargo build --locked -p bark-cli --bin paperclip-walletd --features barkd-web-ui,sqlite-bundled
          python3 deployment/desktop/test_native_daemon.py --binary "$PWD/target/debug/paperclip-walletd"
          python3 scripts/test-hot-profiles-daemon.py "$PWD/target/debug/paperclip-walletd"
          python3 deployment/desktop/test_pipe_io.py -v
          python3 deployment/desktop/test_managed_daemon.py --binary "$PWD/target/debug/paperclip-walletd" -v
          python3 deployment/desktop/test_managed_shutdown.py --binary "$PWD/target/debug/paperclip-walletd" -v
          python3 deployment/desktop/test_launcher_bridge.py --binary "$PWD/target/debug/paperclip-walletd" -v
      - name: Install isolated Linux window-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb xauth imagemagick libsecp256k1-dev libsodium-dev tor
      - name: Prepare the pinned official archive on its native target
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'deployment/desktop')
          from tor_runtime import target
          record = json.loads(Path('deployment/desktop/tor-artifacts.json').read_text())['targets'][target()]
          archive = Path(os.environ['RUNNER_TEMP']) / 'reviewed-tor.tar.gz'
          # The preparer checks the signature-verified hash before extraction.
          with urllib.request.urlopen(record['source'], timeout=60) as response, archive.open('xb') as output:
              total = 0
              while block := response.read(1024 * 1024):
                  total += len(block)
                  if total > 128 * 1024 * 1024: raise ValueError('Oversized Tor download')
                  output.write(block)
          command = [sys.executable, 'deployment/desktop/prepare_tor.py', '--archive', str(archive), '--output', str(archive.parent / 'Tor Runtime')]
          if sys.platform == 'darwin': command += ['--ad-hoc-sign']
          subprocess.run(command, check=True)
          PY
      - name: Verify owned native Tor without network access
        run: python3 deployment/desktop/test_managed_tor.py --tor "$RUNNER_TEMP/Tor Runtime/tor/tor" -v
      - name: Test Linux development shell and package
        run: |
          python3 deployment/desktop/linux/test_launcher.py --binary "$PWD/target/debug/paperclip-walletd" -v
          python3 deployment/desktop/linux/build_preview.py --binary "$PWD/target/debug/paperclip-walletd" --python /usr/bin/python3 --output "$RUNNER_TEMP/Paperclip Linux Preview"
          "$RUNNER_TEMP/Paperclip Linux Preview/bin/paperclip-preview" --help
          xvfb-run -a python3 deployment/desktop/linux/test_launcher_ui.py --binary "$RUNNER_TEMP/Paperclip Linux Preview/bin/paperclip-walletd" --launcher "$RUNNER_TEMP/Paperclip Linux Preview/lib/launcher.py" --screenshots "$RUNNER_TEMP/linux-preview-screenshots" -v
      - name: Build and test bundled Linux Python and Tk
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/freeze-toolchain"
          "$RUNNER_TEMP/freeze-toolchain/bin/python" -m pip install pyinstaller==6.22.3
          "$RUNNER_TEMP/freeze-toolchain/bin/python" deployment/desktop/linux/build_helpers.py --output "$RUNNER_TEMP/Frozen Linux Helpers" --work "$RUNNER_TEMP/linux-freeze-work"
          python3 deployment/desktop/linux/build_preview.py --binary "$PWD/target/debug/paperclip-walletd" --helper "$RUNNER_TEMP/Frozen Linux Helpers/PaperclipLauncher" --output "$RUNNER_TEMP/Standalone Linux Preview"
          "$RUNNER_TEMP/Standalone Linux Preview/bin/paperclip-preview" --help
          mv "$RUNNER_TEMP/Standalone Linux Preview" "$RUNNER_TEMP/Relocated Linux Preview"
          python3 -c 'import hashlib,json,pathlib,sys; p=pathlib.Path(sys.argv[1]); v=json.loads((p/"build-info.json").read_text()); assert v["daemon_sha256"]==hashlib.sha256((p/"bin/paperclip-walletd").read_bytes()).hexdigest(); assert v["helper"]["source_files"]' "$RUNNER_TEMP/Relocated Linux Preview"
          xvfb-run -a "$RUNNER_TEMP/Frozen Linux Helpers/PaperclipLauncherQA/PaperclipLauncherQA" --binary "$RUNNER_TEMP/Relocated Linux Preview/bin/paperclip-walletd" --screenshots "$RUNNER_TEMP/linux-frozen-screenshots" -v
      - uses: actions/setup-python@v5
        id: jars-python
        with:
          python-version: '3.13'
          update-environment: false
      - uses: actions/checkout@v4
        with:
          repository: Kilombino/joinblaket
          ref: 40a29ae4f34930687f0c6be3e9e5bf14a44cc0f3
          path: .ci-joinblaket
          persist-credentials: false
      - name: Freeze the reviewed native Linux Jars runtime
        env:
          JARS_BUILD_PYTHON: ${{ steps.jars-python.outputs.python-path }}
        run: |
          "$JARS_BUILD_PYTHON" -m venv "$RUNNER_TEMP/jars-toolchain"
          runtime="$RUNNER_TEMP/jars-toolchain/bin/python"
          "$runtime" -m pip install --require-hashes -r .ci-joinblaket/jmcore/requirements.txt -r .ci-joinblaket/jmwallet/requirements.txt -r .ci-joinblaket/maker/requirements.txt -r .ci-joinblaket/taker/requirements.txt -r .ci-joinblaket/orderbook_watcher/requirements.txt -r .ci-joinblaket/jmwalletd/requirements.txt
          "$runtime" -m pip install --no-deps ./.ci-joinblaket/jmcore ./.ci-joinblaket/jmwallet ./.ci-joinblaket/maker ./.ci-joinblaket/taker ./.ci-joinblaket/tumbler ./.ci-joinblaket/orderbook_watcher ./.ci-joinblaket/jmwalletd
          "$runtime" -m pip install pyinstaller==6.22.3
          api=$("$runtime" -c 'import importlib.util; print(importlib.util.find_spec("jmwalletd").submodule_search_locations[0] + "/app.py")')
          "$runtime" deployment/jam/install.py "$api"
          secp=$(readlink -f /usr/lib/$(gcc -dumpmachine)/libsecp256k1.so)
          PYTHONPATH="$PWD/deployment/jam" "$runtime" deployment/desktop/linux/build_jars.py --source "$PWD/deployment" --secp256k1 "$secp" --secp256k1-license /usr/share/doc/libsecp256k1-dev/copyright --output "$RUNNER_TEMP/Frozen Jars" --work "$RUNNER_TEMP/jars-freeze-work"
      - name: Verify relocated bundled Jars and wallet lifecycle
        run: |
          python3 deployment/desktop/linux/build_preview.py --binary "$PWD/target/debug/paperclip-walletd" --helper "$RUNNER_TEMP/Frozen Linux Helpers/PaperclipLauncher" --jam-helper "$RUNNER_TEMP/Frozen Jars/PaperclipJars" --tor-runtime "$RUNNER_TEMP/Tor Runtime" --output "$RUNNER_TEMP/Bundled Jars Preview"
          mv "$RUNNER_TEMP/Bundled Jars Preview" "$RUNNER_TEMP/Relocated Jars Preview"
          mv "$RUNNER_TEMP/jars-toolchain" "$RUNNER_TEMP/unused-jars-toolchain"
          mv "$RUNNER_TEMP/Frozen Jars" "$RUNNER_TEMP/unused-jars-build"
          mv .ci-joinblaket "$RUNNER_TEMP/unused-jars-source"
          "$RUNNER_TEMP/Relocated Jars Preview/bin/paperclip-preview" --help
          python3 deployment/desktop/test_managed_jam.py --python "$RUNNER_TEMP/Relocated Jars Preview/lib/PaperclipJars/PaperclipJars" --binary "$RUNNER_TEMP/Relocated Jars Preview/bin/paperclip-walletd" --tor "$RUNNER_TEMP/Relocated Jars Preview/lib/PaperclipTor/tor/tor" -v
          xvfb-run -a "$RUNNER_TEMP/Frozen Linux Helpers/PaperclipLauncherQA/PaperclipLauncherQA" --binary "$RUNNER_TEMP/Relocated Jars Preview/bin/paperclip-walletd" --jam-executable "$RUNNER_TEMP/Relocated Jars Preview/lib/PaperclipJars/PaperclipJars" --tor-runtime "$RUNNER_TEMP/Relocated Jars Preview/lib/PaperclipTor" --screenshots "$RUNNER_TEMP/linux-jars-screenshots" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-preview-screenshots
          path: |
            ${{ runner.temp }}/linux-preview-screenshots/*.png
            ${{ runner.temp }}/linux-frozen-screenshots/*.png
            ${{ runner.temp }}/linux-jars-screenshots/*.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real Chromium with the packaged native daemon
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
          python3 deployment/desktop/test_browser_handoff.py --binary "$RUNNER_TEMP/Paperclip Linux Preview/bin/paperclip-walletd"
      - name: Generate API documentation
        run: nix develop .#build --command cargo run --locked -p bark-rest --example dump_api_docs > bark-rest/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: bark-rest/openapi.json
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.sha }}
