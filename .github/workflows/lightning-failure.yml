name: Lightning failure regression checks
on:
  workflow_dispatch:
  push:
    branches: ['fix/lightning-failed-payment-costs', 'codex/cross-platform-parity']
    paths: ['bark/**', 'bark-cli/**', 'bark-json/**', 'bark-rest/**', 'mobile/rust/**', 'Cargo.lock', 'web/**', 'scripts/test-desktop-handoff-browser.cjs', 'deployment/desktop/**', 'deployment/managed-chain.py', 'deployment/node_tor.py', 'deployment/test_managed_chain.py', 'deployment/test_node_tor.py', 'justfile', '.github/workflows/lightning-failure.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache/restore@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
      - run: sha256sum -c SHARED-SOURCE.sha256
      - run: nix develop .#build --command cargo check --locked -p bark-wallet -p bark-json -p bark-rest --tests --features onchain-bdk
      - run: nix develop .#build --command just unit-wallet lightning
      - run: nix develop .#build --command just unit-wallet onchain::qr
      - run: nix develop .#build --command just unit-wallet onchain::replacement
      - run: nix develop .#build --command just unit-wallet receipt_failure_prevents_arkoor
      - run: nix develop .#build --command just unit-mobile
      - run: nix develop .#build --command just unit-rest
      - run: nix develop .#build --command just unit-daemon
      - run: nix develop .#build --command just unit-creation
      - run: nix develop .#build --command just unit-support
      - run: nix develop .#build --command just unit funded_lightning
      - run: nix develop .#build --command just unit lightning_send_lifetime
      - name: Packaged service supervisor lifecycle
        run: |
          python3 -m unittest discover -s deployment -p test_managed_chain.py
          python3 -m unittest discover -s deployment -p test_node_tor.py
      - name: Unfunded native daemon lifecycle prerequisite
        run: |
          export BARK_WEB_DIST="$PWD/web"
          nix develop .#build --command cargo build --locked -p bark-cli --bin paperclip-walletd --features barkd-web-ui,sqlite-bundled
          python3 deployment/desktop/test_native_daemon.py --binary "$PWD/target/debug/paperclip-walletd"
          python3 deployment/desktop/test_managed_daemon.py --binary "$PWD/target/debug/paperclip-walletd" -v
          python3 deployment/desktop/test_managed_shutdown.py --binary "$PWD/target/debug/paperclip-walletd" -v
          python3 deployment/desktop/test_launcher_bridge.py --binary "$PWD/target/debug/paperclip-walletd" -v
      - name: Install isolated Linux window-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb xauth imagemagick
      - name: Test Linux development shell and package
        run: |
          python3 deployment/desktop/linux/test_launcher.py --binary "$PWD/target/debug/paperclip-walletd" -v
          python3 deployment/desktop/linux/build_preview.py --binary "$PWD/target/debug/paperclip-walletd" --python /usr/bin/python3 --output "$RUNNER_TEMP/Paperclip Linux Preview"
          "$RUNNER_TEMP/Paperclip Linux Preview/bin/paperclip-preview" --help
          xvfb-run -a python3 deployment/desktop/linux/test_launcher_ui.py --binary "$RUNNER_TEMP/Paperclip Linux Preview/bin/paperclip-walletd" --launcher "$RUNNER_TEMP/Paperclip Linux Preview/lib/launcher.py" --screenshots "$RUNNER_TEMP/linux-preview-screenshots" -v
      - name: Build and test bundled Linux Python and Tk
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/freeze-toolchain"
          "$RUNNER_TEMP/freeze-toolchain/bin/python" -m pip install pyinstaller==6.22.3
          "$RUNNER_TEMP/freeze-toolchain/bin/python" deployment/desktop/linux/build_helpers.py --output "$RUNNER_TEMP/Frozen Linux Helpers" --work "$RUNNER_TEMP/linux-freeze-work"
          python3 deployment/desktop/linux/build_preview.py --binary "$PWD/target/debug/paperclip-walletd" --helper "$RUNNER_TEMP/Frozen Linux Helpers/PaperclipLauncher" --output "$RUNNER_TEMP/Standalone Linux Preview"
          "$RUNNER_TEMP/Standalone Linux Preview/bin/paperclip-preview" --help
          mv "$RUNNER_TEMP/Standalone Linux Preview" "$RUNNER_TEMP/Relocated Linux Preview"
          python3 -c 'import hashlib,json,pathlib,sys; p=pathlib.Path(sys.argv[1]); v=json.loads((p/"build-info.json").read_text()); assert v["daemon_sha256"]==hashlib.sha256((p/"bin/paperclip-walletd").read_bytes()).hexdigest(); assert v["helper"]["source_files"]' "$RUNNER_TEMP/Relocated Linux Preview"
          xvfb-run -a "$RUNNER_TEMP/Frozen Linux Helpers/PaperclipLauncherQA/PaperclipLauncherQA" --binary "$RUNNER_TEMP/Relocated Linux Preview/bin/paperclip-walletd" --screenshots "$RUNNER_TEMP/linux-frozen-screenshots" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-preview-screenshots
          path: |
            ${{ runner.temp }}/linux-preview-screenshots/*.png
            ${{ runner.temp }}/linux-frozen-screenshots/*.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real Chromium with the packaged native daemon
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
          python3 deployment/desktop/test_browser_handoff.py --binary "$RUNNER_TEMP/Paperclip Linux Preview/bin/paperclip-walletd"
      - name: Generate API documentation
        run: nix develop .#build --command cargo run --locked -p bark-rest --example dump_api_docs > bark-rest/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: bark-rest/openapi.json
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.sha }}
